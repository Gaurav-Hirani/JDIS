version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jdis_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jdis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdis_password}
      POSTGRES_DB: ${POSTGRES_DB:-jdis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdis_user} -d ${POSTGRES_DB:-jdis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdis_backend
    restart: always
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-jdis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdis_password}
      POSTGRES_DB: ${POSTGRES_DB:-jdis_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jdis_user}:${POSTGRES_PASSWORD:-jdis_password}@db:5432/${POSTGRES_DB:-jdis_db}
      MODEL_CLASSIFIER_PATH: models/final_calibrated_clf.joblib
      MODEL_REGRESSOR_PATH: models/best_ablation_reg.joblib
      MODEL_VERSION: v1.0-config-d
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
